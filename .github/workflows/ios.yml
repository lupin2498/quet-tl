name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      # phần thuật toán dùng chung: bản Swift được đối chiếu với bản Java
      - "android/app/src/main/java/vn/quettailieu/scanner/core/**"
      - "android/tools/desktop/**"
      - "tests/tools/**"
      - "tests/images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  algo-linux:
    # kiểm tra nhanh phần thuật toán Swift: so với toạ độ thật, kiểm thử độ bền (fuzz), đối chiếu từng kết quả với bản Java
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: |
          which swift || ls /usr/share/swift/usr/bin
          swift --version
      - name: Chuyển ảnh thử sang PPM
        run: |
          pip3 install --break-system-packages -q pillow numpy pypdf || pip3 install -q pillow numpy pypdf
          mkdir -p out/algo
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          for f in glob.glob('tests/images/*.jpg'):
              Image.open(f).convert('RGB').save('out/algo/' + os.path.basename(f)[:-4] + '.ppm')
          PY
          cp tests/images/doc_1_wood.jpg out/algo/sample.jpg
      - name: Biên dịch + chạy
        run: |
          swiftc -O -o out/algotest ios/Sources/DocDetector.swift ios/Sources/Enhancer.swift ios/Sources/Retouch.swift ios/Sources/Flatten.swift ios/Sources/Geom.swift ios/Sources/PdfWriter.swift ios/Tests/linux/main.swift
          set -o pipefail
          ./out/algotest tests/images/gt.txt out/algo 2>&1 | tee out/algo/result.txt

      - name: Kiểm thử độ bền (fuzz) + kiểm tra PDF bằng trình phân tích thật
        run: |
          set -o pipefail
          mkdir -p out/fuzz
          cp tests/images/doc_1_wood.jpg out/fuzz/sample.jpg
          ./out/algotest --fuzz 60 out/fuzz 2>&1 | tee out/algo/fuzz.txt
          python3 tests/tools/check_pdfs.py out/fuzz out/algo/test.pdf 2>&1 | tee out/algo/fuzz-pdf.txt
          rm -rf out/fuzz

      - name: Đối chiếu bản Swift với bản Java (cùng dữ liệu tổng hợp)
        run: |
          set -o pipefail
          python3 tests/tools/make_core_inputs.py out/core-in
          # trang đã nắn phẳng có ngón tay / chữ viết tay / con dấu / bóng đổ: đối chiếu bộ lọc mới + Xóa thông minh
          sudo apt-get install -y -q fonts-dejavu-core > /dev/null 2>&1 || true
          python3 tests/tools/make_retouch_images.py out/core-in 700
          # trang mấp mô / gấp nếp (wv_*.ppm; đáp án ở out/core-in/gt — hai bản bỏ qua vì chỉ đọc *.ppm ngay trong thư mục):
          # đối chiếu bộ lọc Làm phẳng (làm sạch + nắn thẳng) từng điểm ảnh và thông số trường nắn
          python3 tests/tools/make_wavy_images.py out/core-in 700
          # các nhánh của Làm phẳng mà trang 700 điểm ảnh không đi qua (trang đầy đủ trong ứng dụng dài tới 3508 điểm ảnh):
          # trang lớn (khối phân tích k = 3, ô làm sạch d = 2), trang chụp xoay ngang (dòng chữ chạy dọc: trường nắn chuyển
          # vị, nhân k), ảnh nhỏ < 600 điểm ảnh (ảnh mẫu của bảng lọc) — thêm vào out/core-in với tên wv_* khác
          python3 tests/tools/make_wavy_images.py out/wv-big 2700
          python3 tests/tools/make_wavy_images.py out/wv-small 520
          # cỡ chữ 10-15 điểm ảnh (ngưỡng "chữ nhỏ" nâng dần: trang 1000) và ảnh chụp tài liệu phẳng độ phân giải thấp
          # (dấu thanh, chấm, đường kẻ bảng mảnh, chữ ký bút xanh mảnh — tests/images/doc_*, cắt theo khung trang, thu nhỏ)
          python3 tests/tools/make_wavy_images.py out/wv-mid 1000
          python3 - <<'PY'
          from PIL import Image
          for src, names, prefix, rot in (("out/wv-big", ("wv_mixed",), "wv_big_", False),
                                          ("out/wv-big", ("wv_curl",), "wv_big_rot_", True),
                                          ("out/core-in", ("wv_waves",), "wv_rot_", True),
                                          ("out/wv-small", ("wv_mixed", "wv_waves"), "wv_small_", False),
                                          ("out/wv-small", ("wv_curl",), "wv_small_rot_", True),
                                          ("out/wv-mid", ("wv_folds", "wv_mixed", "wv_crumple"), "wv_mid_", False)):
              for n in names:
                  im = Image.open("%s/%s.ppm" % (src, n))
                  if rot:
                      im = im.transpose(Image.Transpose.ROTATE_270)  # xoay 90 độ theo chiều kim đồng hồ
                  im.save("out/core-in/%s%s.ppm" % (prefix, n[3:]))
          for doc, box, s in (("doc_1_wood", (214, 277, 1017, 1425), 1.0), ("doc_4_beige", (271, 333, 1016, 1380), 0.7),
                              ("doc_5_blue", (98, 226, 1000, 1383), 0.6)):
              im = Image.open("tests/images/%s.jpg" % doc).convert("RGB").crop(box)
              if s != 1.0:
                  im = im.resize((round(im.width * s), round(im.height * s)), Image.BOX)
              im.save("out/core-in/wv_doc_%s.ppm" % doc.split("_")[1])
          PY
          rm -rf out/wv-big out/wv-small out/wv-mid
          mkdir -p out/jcls
          javac -encoding UTF-8 -d out/jcls android/app/src/main/java/vn/quettailieu/scanner/core/*.java android/tools/desktop/DumpCore.java
          java -Dfile.encoding=UTF-8 -cp out/jcls DumpCore out/core-in out/core-java 2>&1 | tee out/algo/compare.txt
          ./out/algotest --dump out/core-in out/core-swift 2>&1 | tee -a out/algo/compare.txt
          python3 tests/tools/compare_core.py out/core-in out/core-java out/core-swift 2>&1 | tee -a out/algo/compare.txt
          python3 tests/tools/check_pdfs.py out/core-java out/core-swift | tail -1 | tee -a out/algo/compare.txt

      - name: Đẩy kết quả lên nhánh ci/ios-algo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/algo && cd out/algo
          rm -f *.ppm
          git init -q
          git checkout -q -b ci/ios-algo
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ios-algo run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}" || true
          # mạng chập chờn: thử lại vài lần trước khi coi là lỗi
          for n in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/ios-algo; then exit 0; fi
            echo "Đẩy kết quả lỗi (lần $n), thử lại"; sleep $((n * 15))
          done
          exit 1

  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Thông tin Xcode
        run: |
          mkdir -p out
          ls /Applications | grep -i xcode || true
          xcodebuild -version | tee out/xcode-version.txt
          xcrun simctl list runtimes | tee out/runtimes.txt

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh dự án Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Build IPA (chưa ký)
        working-directory: ios
        run: |
          set +e
          xcodebuild -project QuetTaiLieu.xcodeproj -scheme QuetTaiLieu -sdk iphoneos -configuration Release \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > ../out/build-device.log 2>&1
          code=$?
          grep -E "error:|warning:" ../out/build-device.log | sort -u | head -150 > ../out/build-device-issues.txt
          cat ../out/build-device-issues.txt
          tail -5 ../out/build-device.log
          if [ $code -ne 0 ]; then echo "BUILD FAILED"; exit $code; fi
          APP=build-device/Build/Products/Release-iphoneos/QuetTaiLieu.app
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          # ảnh thử chỉ dùng cho tự kiểm thử trên Simulator -> bỏ khỏi bộ cài
          rm -rf Payload/QuetTaiLieu.app/TestImages
          # ký ad-hoc (không cần chứng chỉ) để TrollStore/eSign nhận; Sideloadly/AltStore sẽ ký lại bằng Apple ID
          codesign --force --deep --sign - --timestamp=none Payload/QuetTaiLieu.app
          codesign -dv Payload/QuetTaiLieu.app 2>&1 | head -5
          zip -qry ../out/QuetTaiLieu-unsigned.ipa Payload
          ls -la ../out/QuetTaiLieu-unsigned.ipa
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" > ../out/Info.plist.txt || true

      - name: Build cho Simulator
        working-directory: ios
        run: |
          set +e
          xcodebuild -project QuetTaiLieu.xcodeproj -scheme QuetTaiLieu -sdk iphonesimulator -configuration Release \
            -derivedDataPath build-sim -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            build > ../out/build-sim.log 2>&1
          code=$?
          grep -E "error:" ../out/build-sim.log | sort -u | head -80
          tail -3 ../out/build-sim.log
          exit $code

      - name: Tự kiểm thử trên iOS Simulator
        run: |
          set +e
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              ver=tuple(int(x) for x in rt.split("iOS-")[-1].split("-") if x.isdigit())
              for x in devs:
                  if x["name"].startswith("iPhone") and "Pro Max" not in x["name"] and "SE" not in x["name"]:
                      k=(ver, x["name"])
                      if best is None or k>best[0]: best=(k,x["udid"])
          print(best[1] if best else "")
          ')
          echo "UDID=$UDID"
          xcrun simctl list devices | grep "$UDID" | tee out/simulator.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=ios/build-sim/Build/Products/Release-iphonesimulator/QuetTaiLieu.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant photos vn.quettailieu.scanner || true
          xcrun simctl privacy "$UDID" grant photos-add vn.quettailieu.scanner || true
          xcrun simctl launch --console-pty "$UDID" vn.quettailieu.scanner -selftest > out/console.log 2>&1 &
          sleep 5
          DATA=$(xcrun simctl get_app_container "$UDID" vn.quettailieu.scanner data)
          echo "DATA=$DATA"
          mkdir -p out/simctl
          # tối đa ~25 phút (phần làm đẹp trang / chỉnh sửa làm bộ tự kiểm thử dài hơn)
          for i in $(seq 1 480); do
            if [ -f "$DATA/Documents/selftest/done.txt" ]; then echo "self-test xong sau ${i}x3s"; break; fi
            if [ $((i % 5)) -eq 0 ]; then xcrun simctl io "$UDID" screenshot "out/simctl/s_$(printf %03d $i).png" > /dev/null 2>&1; fi
            if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "vn.quettailieu.scanner"; then
              echo "Ứng dụng đã dừng (có thể bị crash) ở lần kiểm tra $i"; break
            fi
            sleep 3
          done
          xcrun simctl io "$UDID" screenshot out/simctl/final.png > /dev/null 2>&1
          mkdir -p out/selftest
          cp -R "$DATA/Documents/selftest/." out/selftest/ 2>/dev/null
          ls -la out/selftest
          cat out/selftest/results.txt
          mkdir -p out/crash
          # báo cáo crash được hệ thống ghi chậm vài giây sau khi ứng dụng dừng
          if [ ! -f out/selftest/done.txt ]; then sleep 12; fi
          find ~/Library/Logs/DiagnosticReports -name "*QuetTaiLieu*" -mmin -60 -exec cp {} out/crash/ \; 2>/dev/null
          ls out/crash
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "QuetTaiLieu"' > out/syslog.txt 2>/dev/null
          tail -c 200000 out/syslog.txt > out/syslog-tail.txt; rm -f out/syslog.txt
          xcrun simctl terminate "$UDID" vn.quettailieu.scanner || true
          {
            echo "# iOS CI — run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
            echo
            echo "- Xcode: $(head -1 out/xcode-version.txt)"
            echo "- Simulator: $(cat out/simulator.txt | sed 's/^ *//')"
            echo "- IPA: $(ls -la out/QuetTaiLieu-unsigned.ipa 2>/dev/null | awk '{print $5}') bytes"
            echo "- Crash logs: $(ls out/crash | wc -l | tr -d ' ')"
            echo
            echo '```'
            cat out/selftest/results.txt 2>/dev/null || echo "không có results.txt"
            echo '```'
            for f in out/crash/*; do
              [ -f "$f" ] || continue
              echo
              echo "## Crash: $(basename "$f")"
              echo '```'
              grep -m1 -A40 -E '"exception"|Exception Type|Termination Reason|Thread 0 Crashed|"faultingThread"' "$f" | head -80
              echo '```'
            done
          } > out/summary.md
          cat out/summary.md
          if [ ! -f out/selftest/done.txt ]; then echo "SELF-TEST KHÔNG HOÀN TẤT"; exit 1; fi
          if grep -q "failed=0" out/selftest/done.txt; then exit 0; else echo "SELF-TEST CÓ LỖI"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: out/

      - name: Đẩy kết quả lên nhánh ci/ios
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          rm -f build-device.log.big
          if [ -f build-device.log ] && [ $(wc -c < build-device.log) -gt 5000000 ]; then tail -c 3000000 build-device.log > b && mv b build-device.log; fi
          if [ -f build-sim.log ] && [ $(wc -c < build-sim.log) -gt 5000000 ]; then tail -c 3000000 build-sim.log > b && mv b build-sim.log; fi
          # Ảnh chụp màn hình PNG của bộ tự kiểm thử nặng hơn 100 MB -> lần đẩy dễ quá thời gian (HTTP 408).
          # Nhánh kết quả chỉ để xem nên đổi sang JPEG thu nhỏ; bản PNG gốc vẫn nằm trong artifact của lần chạy.
          for d in selftest simctl; do
            [ -d "$d" ] || continue
            for f in "$d"/*.png; do
              [ -f "$f" ] || continue
              if sips -s format jpeg -s formatOptions 80 -Z 1600 "$f" --out "${f%.png}.jpg" > /dev/null 2>&1; then rm -f "$f"; fi
            done
          done
          du -sh . || true
          git init -q
          git checkout -q -b ci/ios
          git config http.postBuffer 524288000
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ios run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}"
          # mạng chập chờn: thử lại vài lần trước khi coi là lỗi
          for n in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/ios; then exit 0; fi
            echo "Đẩy kết quả lỗi (lần $n), thử lại"; sleep $((n * 15))
          done
          exit 1
