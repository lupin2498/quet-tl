name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Chỉ chạy các bước kiểm thử máy ảo có tên khớp biểu thức này (để trống = chạy hết)"
        required: false
        default: ""
      apis:
        description: "Danh sách API máy ảo (JSON)"
        required: false
        default: "[24, 29, 34]"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug + release chưa ký)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Kiểm thử thuật toán tìm mép (JVM)
        run: |
          set -o pipefail
          mkdir -p out/core-classes out/core
          javac -encoding UTF-8 -d out/core-classes android/app/src/main/java/vn/quettailieu/scanner/core/*.java android/tools/desktop/*.java
          java -Dfile.encoding=UTF-8 -DminOk=6 -cp out/core-classes EvalSynth tests/images/gt.txt out/core | tee out/core/core-tests.txt

      # Ảnh vào / file trung gian của các bước kiểm thử JVM để ở $RUNNER_TEMP, không ở out/: bước đẩy kết quả chạy cả khi
      # job lỗi và đẩy toàn bộ out/ (git add -A) — để trong out/ thì bước kiểm thử lỗi sẽ đẩy hàng chục MB ảnh PPM / PDF
      # lên ci/android-build (gói quá nặng, đẩy dễ hỏng).
      - name: Kiểm thử làm đẹp trang / xóa thông minh (JVM, ảnh tổng hợp sinh tại chỗ)
        run: |
          set -o pipefail
          sudo apt-get install -y -q fonts-dejavu-core > /dev/null 2>&1 || true
          pip3 install --break-system-packages -q numpy pillow || pip3 install -q numpy pillow
          python3 tests/tools/make_retouch_images.py "$RUNNER_TEMP/retouch-in" 1400
          java -Dfile.encoding=UTF-8 -cp out/core-classes EvalRetouch "$RUNNER_TEMP/retouch-in" | tee out/core/retouch-tests.txt

      - name: Kiểm thử bộ lọc Làm phẳng (JVM, trang giấy mấp mô / gấp nếp tổng hợp sinh tại chỗ)
        # dùng phông DejaVu + numpy/pillow cài ở bước trên
        run: |
          set -o pipefail
          python3 tests/tools/make_wavy_images.py "$RUNNER_TEMP/wavy-in" 1400
          java -Dfile.encoding=UTF-8 -cp out/core-classes EvalFlatten "$RUNNER_TEMP/wavy-in" | tee out/core/flatten-tests.txt

      - name: Kiểm thử Làm phẳng giữ nội dung ở ảnh độ phân giải thấp + không nắn méo trang phẳng (JVM)
        # ảnh chụp tài liệu phẳng tests/images ở cạnh dài 500-1754 điểm ảnh (dấu thanh, chấm, đường kẻ mảnh, chữ ký mảnh phải
        # còn); trang phẳng tổng hợp cỡ 1500 và 3000 (con dấu cạnh dòng chữ không được làm cong trang)
        run: |
          set -o pipefail
          python3 tests/tools/make_retouch_images.py "$RUNNER_TEMP/flat-1500" 1500
          python3 tests/tools/make_retouch_images.py "$RUNNER_TEMP/flat-3000" 3000
          java -Djava.awt.headless=true -Dfile.encoding=UTF-8 -cp out/core-classes EvalKeep tests/images \
            "$RUNNER_TEMP/flat-1500" "$RUNNER_TEMP/flat-3000" | tee out/core/keep-tests.txt

      - name: Kiểm thử độ bền thuật toán (fuzz) + kiểm tra PDF bằng trình phân tích thật
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fuzz"
          java -Dfile.encoding=UTF-8 -cp out/core-classes FuzzCore "$RUNNER_TEMP/fuzz" 60 | tee out/core/fuzz.txt
          pip3 install --break-system-packages -q pypdf pillow || pip3 install -q pypdf pillow
          python3 tests/tools/check_pdfs.py "$RUNNER_TEMP/fuzz" | tee out/core/fuzz-pdf.txt

      - name: Gom kết quả
        if: always()
        run: |
          mkdir -p out/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/apk/ || true
          cp android/app/build/outputs/apk/release/*.apk out/apk/ || true
          ls -la out/apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/apk/

      - name: Đẩy kết quả lên nhánh ci/android-build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git checkout -q -b ci/android-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}"
          # mạng chập chờn: thử lại vài lần trước khi coi là lỗi
          for n in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/android-build; then exit 0; fi
            echo "Đẩy kết quả lỗi (lần $n), thử lại"; sleep $((n * 15))
          done
          exit 1

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event.inputs.apis || '[24, 29, 34]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Cài Pillow + pypdf (tạo ảnh thử, kiểm tra PDF xuất ra)
        run: pip3 install --break-system-packages -q pillow pypdf || pip3 install -q pillow pypdf || true

      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chạy kiểm thử trên máy ảo API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: python3 tests/android/run_tests.py apk/app-debug.apk test-out
        env:
          TEST_ONLY: ${{ github.event.inputs.only }}

      - name: Đẩy kết quả lên nhánh ci/android-${{ matrix.api }}
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p test-out
          cd test-out
          git init -q
          git checkout -q -b ci/android-${{ matrix.api }}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator api=${{ matrix.api }} run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} status=${{ job.status }}" || true
          # mạng chập chờn: thử lại vài lần trước khi coi là lỗi
          for n in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/android-${{ matrix.api }}; then exit 0; fi
            echo "Đẩy kết quả lỗi (lần $n), thử lại"; sleep $((n * 15))
          done
          exit 1
